name = "subtitlecat-vi"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = []

# Sau khi chay: npx wrangler kv namespace create SUBCAT_KV
# lenh tren se in ra 1 dong dang:
#   { binding = "SUBCAT_KV", id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
# copy ID do dan vao duoi day (thay YOUR_KV_ID_HERE).
[[kv_namespaces]]
binding = "SUBCAT_KV"
id = "62b28852a41d4020a3edcaf5e0c49a78"

[vars]
# TTL cache (giay)
DECISION_TTL_SECONDS = "43200"
SUBTITLE_TTL_SECONDS = "2592000"
# Nguong diem tuong dong toi thieu de chap nhan 1 trang subtitlecat la dung phim (0..1)
MIN_MATCH_SCORE = "0.35"
